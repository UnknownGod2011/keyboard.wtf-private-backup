name: paid-staging-ci

on:
  push:
    branches: [paid-staging]
  pull_request:
    branches: [paid-staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore KeyboardWtf.sln --locked-mode

      - name: Build
        run: dotnet build KeyboardWtf.sln -c Release --no-restore

      - name: Test
        run: dotnet test KeyboardWtf.sln -c Release --no-restore --no-build --filter "Category!=FirestoreIntegration" --logger "trx;LogFileName=release-tests.trx"

      # Real Firestore transaction tests are intentionally not represented as
      # unit-test passes. Run scripts/staging/run-firestore-integration.ps1
      # against the isolated staging project as a separate release gate.

      - name: Check vulnerable dependencies
        shell: pwsh
        run: |
          $result = dotnet list KeyboardWtf.sln package --vulnerable --include-transitive
          $result | Write-Host
          if ($LASTEXITCODE -ne 0 -or $result -match 'has the following vulnerable packages') { throw 'Vulnerable package gate failed.' }

      - name: Scan tracked source for secrets
        shell: pwsh
        run: scripts/security/scan-secrets.ps1

      - name: Validate frontend and extension JavaScript
        shell: pwsh
        run: |
          node --check staging/site/app.js
          node --check staging/site/account.js
          node --check production/site/app.js
          node --check production/site/account.js
          node --check production/site/downloads.js
          node --check production/site/pricing.js
          node --check production/site/reviews.js
          node --check production/site/desktop-login.js
          Get-ChildItem extensions/keyboard-wtf-browser-helper-v2 -Filter *.js -Recurse | ForEach-Object { node --check $_.FullName }

      - name: Test Chrome Helper native reconnect
        run: node extensions/keyboard-wtf-browser-helper-v2/scripts/test-native-reconnect.js

      - name: Test Chrome Helper form context
        run: node extensions/keyboard-wtf-browser-helper-v2/scripts/test-form-context.js

      - name: Test Chrome Helper liveness and cancellation
        run: node extensions/keyboard-wtf-browser-helper-v2/scripts/test-bridge-lifecycle.js

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package exact paid-production source
        shell: pwsh
        run: scripts/build-windows-release.ps1 -PaidProductionRelease -SkipSiteHashUpdate

      - name: Prove clean-user paid-production runtime
        shell: pwsh
        run: scripts/release/test-paid-production-runtime.ps1 -Executable dist/release/keyboard-wtf-win-x64/keyboard.wtf.exe

      - name: Generate SBOM
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/KeyboardWtf.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not read the desktop version.' }
          scripts/release/generate-sbom.ps1 -BuildDirectory dist/release/keyboard-wtf-win-x64 -Version $version

      - name: Record provenance
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/KeyboardWtf.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not read the desktop version.' }
          $installer = Get-Item dist/installer/keyboard-wtf-setup.exe
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            version = $version
            buildDateUtc = [DateTimeOffset]::UtcNow.ToString('O')
            installer = $installer.Name
            installerSha256 = $hash
            signingKeyId = 'kwt-release-2026-01'
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/release-provenance.json

      - name: Upload verified production artifacts (manual runs only)
        if: github.event_name == 'workflow_dispatch' && github.repository == 'UnknownGod2011/keyboard.wtf-private-backup'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keyboard-wtf-${{ github.sha }}
          if-no-files-found: error
          # This is an optional short-lived diagnostic bundle, not a release or
          # backup. Push/PR CI still builds and verifies the exact package but
          # does not retain another ~80 MB copy for every commit. Release assets
          # remain in GitHub Releases.
          retention-days: 1
          path: |
            dist/installer/keyboard-wtf-setup.exe
            dist/release-provenance.json
            dist/sbom/**
            **/release-tests.trx
