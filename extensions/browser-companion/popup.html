<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>keyboard.wtf Browser Companion</title>
    <style>
      :root {
        color-scheme: dark;
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: rgba(255,255,255,.92);
        background: #0b0b0d;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        background: radial-gradient(circle at top left, rgba(80,80,90,.45), transparent 42%), #0b0b0d;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .orb {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: linear-gradient(135deg, #7dd3fc, #a78bfa 52%, #34d399);
        box-shadow: 0 0 24px rgba(125, 211, 252, .25);
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 9px;
        border-radius: 999px;
        background: rgba(255,255,255,.08);
        margin: 2px 0 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #f59e0b;
      }
      .dot.ok { background: #19c37d; }
      .dot.err { background: #ef4444; }
      .row {
        display: grid;
        grid-template-columns: 112px 1fr;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid rgba(255,255,255,.08);
      }
      .label { color: rgba(255,255,255,.55); }
      .value {
        word-break: break-word;
        color: rgba(255,255,255,.86);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        flex: 1;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 10px;
        background: rgba(255,255,255,.08);
        color: rgba(255,255,255,.92);
        padding: 8px 10px;
        cursor: pointer;
      }
      button:hover { background: rgba(255,255,255,.13); }
      .error {
        margin-top: 12px;
        color: #fca5a5;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="orb"></div>
      <div>
        <h1>Browser Companion</h1>
        <div id="subtitle">Checking bridge…</div>
      </div>
    </div>

    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Waiting</span></div>

    <div class="row"><div class="label">Extension</div><div class="value" id="version">—</div></div>
    <div class="row"><div class="label">Content script</div><div class="value" id="contentVersion">—</div></div>
    <div class="row"><div class="label">Browser</div><div class="value" id="browserName">—</div></div>
    <div class="row"><div class="label">Bridge</div><div class="value" id="bridge">—</div></div>
    <div class="row"><div class="label">Last heartbeat</div><div class="value" id="heartbeat">—</div></div>
    <div class="row"><div class="label">Active tab</div><div class="value" id="activeTab">—</div></div>
    <div class="row"><div class="label">Controls</div><div class="value" id="controls">—</div></div>
    <div class="row"><div class="label">Last result</div><div class="value" id="lastResult">—</div></div>

    <div class="actions">
      <button id="retry">Reconnect</button>
      <button id="sendGraph">Send test graph</button>
    </div>
    <div class="error" id="error"></div>

    <script src="popup.js"></script>
  </body>
</html>
